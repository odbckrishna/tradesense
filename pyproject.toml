[project]
name = "tradesense"
version = "0.1.0"
description = "Market analysis platform: OANDA candles + pluggable strategies + LLM decisions (signals only, no order placement)."
readme = "README.md"
authors = [
    { name = "Saikrishna Cheruvu", email = "odbc.krishna@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "fastmcp>=4.0.10",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "markdown>=3.11",
    "mplfinance>=0.12.10b0",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "openai>=3.24.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "ta>=0.11.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=16.1.1",
]

[project.scripts]
tradesense = "tradesense.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-markdown>=3.10.2.20260712",
    "types-pyyaml>=6.0.12.20260906",
]

# --------------------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["strategy_library"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "PT"]
ignore = [
    "RUF001", # ambiguous unicode characters in strings (UI icons / math symbols are intentional)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["tradesense"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["tradesense"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
# These libraries ship without type information.
module = ["pandas.*", "ta.*", "mplfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
